description     "Waydroid Android session service"
author          "whaleos-dev@navercorp.com"

# Start after container daemon is running; stop with it.
start on started waydroid-container
stop on stopping waydroid-container

kill signal SIGTERM
kill timeout 10

respawn
respawn limit 5 300

oom score -100

env LD_LIBRARY_PATH=/usr/local/lib64
env GI_TYPELIB_PATH=/usr/lib64/girepository-1.0
# Match waydroid-container.conf: route bare `lxc-start` PATH lookups
# through the SELinux-labeled wrapper at /usr/lib/waydroid/bin/lxc-start.
env PATH=/usr/lib/waydroid/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin

pre-start script
  # Wait until id.waydro.Container is registered on system D-Bus (up to 20s).
  # waydroid session start calls ContainerManager.Start which needs the daemon.
  for i in $(seq 1 20); do
    gdbus introspect --system --dest id.waydro.Container \
        --object-path /ContainerManager >/dev/null 2>&1 && break
    sleep 1
  done
end script

# Patch 0005 auto-sets DBUS_SESSION_BUS_ADDRESS, XDG_DATA_HOME, XDG_RUNTIME_DIR,
# and WAYLAND_DISPLAY from ChromeOS defaults — no env vars needed here.
exec python3 /usr/lib/waydroid/waydroid.py session start

post-stop script
  # Clean up session D-Bus socket so next start gets a fresh daemon.
  rm -f /run/waydroid-session.sock  # croslint: disable:
end script

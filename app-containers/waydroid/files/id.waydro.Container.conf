<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!--
  Copyright 2024 NAVER Authors. All rights reserved.
  D-Bus system bus policy for Waydroid container service.
-->

<busconfig>
  <!-- Root runs the container service daemon -->
  <policy user="root">
    <allow own="id.waydro.Container"/>
    <allow send_destination="id.waydro.Container"/>
    <allow receive_sender="id.waydro.Container"/>
  </policy>

  <!-- chronos (the logged-in user) can call the container service -->
  <policy user="chronos">
    <allow send_destination="id.waydro.Container"/>
    <allow receive_sender="id.waydro.Container"/>
  </policy>

  <!-- Any user can call the container service (needed for waydroid session) -->
  <policy context="default">
    <allow send_destination="id.waydro.Container"/>
  </policy>
</busconfig>

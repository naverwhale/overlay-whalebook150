<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!--
  Copyright 2024 NAVER Authors. All rights reserved.
  D-Bus session bus policy for Waydroid session service.
-->

<busconfig>
  <!-- Any user can own and call the session service on the session bus -->
  <policy context="default">
    <allow own="id.waydro.Session"/>
    <allow send_destination="id.waydro.Session"/>
    <allow receive_sender="id.waydro.Session"/>
  </policy>
</busconfig>

<!DOCTYPE busconfig PUBLIC
  "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
  "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!--
  Session bus used by Waydroid on WhaleOS.

  Hardened over the upstream default to remove three attack vectors
  identified in review:

    1. Socket mode 0777 was replaced with 0660 so unrelated local
       processes (e.g. extensions running as a different uid) cannot
       even connect to the bus.

    2. The blanket `allow own="*"` was replaced with explicit `own=`
       allows for just the Waydroid service names, plus a
       default-deny.  Without this, any local process that could
       open the socket was free to request the well-known name
       `id.waydro.Session` and impersonate Waydroid to the host-side
       waydroid CLI / waydroid_helper subprocess.

    3. The two `allow eavesdrop="true"` lines (on send and on
       receive) were removed entirely.  Eavesdropping is a
       debug-only privilege; in shipped config it would let any
       connected client snoop on session traffic (e.g. clipboard
       contents, intent payloads).

  ANONYMOUS auth is retained because the Waydroid Python services
  intentionally avoid the per-uid ~/.dbus-keyrings/ cookie dance, but
  the socket DAC + explicit name policy below contain the risk: the
  bus is reachable only by processes that share the bus owner's
  effective uid/gid (root in our setup).
-->
<busconfig>
  <type>session</type>
  <listen>unix:path=/run/waydroid-session.sock,mode=0660</listen>
  <auth>ANONYMOUS</auth>
  <allow_anonymous/>

  <policy context="default">
    <!-- Default-deny ownership; explicit allows below are the only
         names a client on this bus may own. -->
    <deny own="*"/>

    <!-- id.waydro.Session is the well-known name the session_manager
         python process registers (see tools/actions/session_manager.py).
         Every other Waydroid service (ClipboardManager,
         NotificationManager, UserManager, HardwareManager) hangs off
         this single bus name as a sub-object path, so this is the
         only name we need to allow ownership of. -->
    <allow own="id.waydro.Session"/>

    <!-- Routine bus-housekeeping calls.  Clients must be able to
         RequestName, ListNames, etc. on org.freedesktop.DBus. -->
    <allow send_destination="org.freedesktop.DBus"/>
    <allow receive_sender="org.freedesktop.DBus"/>

    <!-- Calls into Waydroid: the host-side `waydroid` CLI and our
         waydroid_helper subprocess speak to id.waydro.Session here.
         Replies (receive_sender) are allowed for the same name. -->
    <allow send_destination="id.waydro.Session"/>
    <allow receive_sender="id.waydro.Session"/>
  </policy>
</busconfig>

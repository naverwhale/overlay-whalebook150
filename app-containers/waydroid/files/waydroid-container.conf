description     "Waydroid Android container service"
author          "whaleos-dev@navercorp.com"

# Start at the login prompt, stop when Chrome's UI restarts on sign-out.
#
# session_manager (platform2/login_manager) keeps the same chrome
# process across sign-in (`SetBrowserSessionForUser` only attaches the
# user's profile, no chrome restart), so the wayland-0 socket inode
# survives the login transition and our hwcomposer's wayland client
# connection stays valid.  That means a container booted on the login
# screen is *the* container the user lands in -- no ~25s cold start
# after first sign-in.
#
# session_manager *does* kill chrome on sign-out (`StopSessionWith
# Reason -> ScheduleShutdown`), upstart's `stopping ui` event fires,
# and the next `login-prompt-visible` brings up a fresh chrome with
# a new wayland-0 inode.  We follow that cycle: tear down with the
# old chrome, come back up with the new one before the user signs
# in again.  Same pattern as ARC++/ARCVM, which also cold-start on
# every sign-in cycle but are pre-warmed on the very first login.
#
# pre-start's verify-based wait (Phase 2 -- nc -zU wayland-0) handles
# the race where `login-prompt-visible` fires before chrome's wayland
# server has actually called accept(): we don't proceed until a
# connect handshake succeeds, regardless of timing.
start on login-prompt-visible
stop on stopping ui

# This daemon runs as root (needed for LXC container management).
# Kill it gracefully on stop.
kill signal SIGTERM
kill timeout 30

respawn
respawn limit 5 300

oom score -100

# libgbinder and python-gbinder are installed under /usr/local/lib64 on
# WhaleOS dev images; LD_LIBRARY_PATH ensures they are found when Upstart
# runs without the developer shell environment.
env LD_LIBRARY_PATH=/usr/local/lib64
env GI_TYPELIB_PATH=/usr/lib64/girepository-1.0

# Prepend the Waydroid-only bin dir so Python helpers'
# `subprocess.Popen(["lxc-start", ...])` PATH lookup resolves to our
# /usr/lib/waydroid/bin/lxc-start wrapper rather than /usr/bin/lxc-start.
# The wrapper carries the whaleos_waydroid_exec SELinux label, which
# scopes the domain transition to Waydroid invocations only -- other
# lxc-start users on the host keep their original domain.
env PATH=/usr/lib/waydroid/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin

pre-start script
  # WhaleOS: only run on dev/CI images.  /etc/chrome_dev.conf is
  # installed unconditionally by platform2/login_manager, so file
  # existence alone is not a reliable dev-vs-release signal; the
  # actual signal is whether our own `--enable-whale-waydroid`
  # opt-in has been appended to it (release images keep the stock
  # platform2 file, which never carries this switch).  The
  # anchored regex refuses commented-out (`#--enable-...`) and
  # disabled (`!--enable-...`) lines so intentionally-off states
  # do not accidentally arm the container.  Gate safety therefore
  # hinges on the stock platform2 chrome_dev.conf not carrying
  # this switch -- revisit this predicate if that ever changes.
  # Skipping the pre-warm here also removes the
  # servicemanager/hwservicemanager/vndservicemanager EPOLLWAKEUP
  # timerfd wakeup sources that would otherwise abort suspend on
  # release builds.
  if ! grep -qE '^[[:space:]]*--enable-whale-waydroid([[:space:]=]|$)' \
        /etc/chrome_dev.conf 2>/dev/null; then
    logger -t "${UPSTART_JOB}" \
      "chrome_dev.conf missing --enable-whale-waydroid; not starting"
    stop
    exit 0
  fi

  # Sentinel so post-stop knows this run actually armed the container.
  # Teardown must be driven by "did we set anything up?", not by the
  # current chrome_dev.conf content: an operator may disable the switch
  # *while* the container is running (rootfs remount-rw and edit is a
  # documented flow), and the resulting `restart ui` cycle must still
  # unwind the binder nodes / cgroups / mounts / shill claims / bridge
  # we established on the previous start.  /run is tmpfs so the sentinel
  # is naturally cleared on reboot.
  : >/run/waydroid-container.armed  # croslint: disable:

  logger -t "${UPSTART_JOB}" "Starting Waydroid container service"

  # ----- Phase 1: verify the previous instance is fully torn down -----
  #
  # `kill timeout 30` should have handled this on stop, but if the
  # previous lxc-start ignored SIGTERM, or if upstart re-fires `start`
  # before post-stop drains the cgroup / unmounts the rootfs, we'd
  # race with the old instance.  Wait for observable cleanup, then
  # forcibly clean what's left.
  CLEANUP_DEADLINE=$(($(date +%s) + 20))
  while [ "$(date +%s)" -lt "${CLEANUP_DEADLINE}" ]; do
    LEFTOVER=
    if pgrep -af "lxc-start.*-n waydroid" >/dev/null 2>&1; then
      LEFTOVER="lxc-start process"
    elif [ -s /sys/fs/cgroup/freezer/lxc.payload.waydroid/cgroup.procs \
            2>/dev/null ]; then
      LEFTOVER="payload cgroup procs"
    elif mountpoint -q /usr/local/var/lib/waydroid/rootfs 2>/dev/null; then
      LEFTOVER="rootfs mount"
    fi
    if [ -z "${LEFTOVER}" ]; then
      break
    fi
    sleep 0.25
  done
  if [ -n "${LEFTOVER}" ]; then
    logger -t "${UPSTART_JOB}" "Forcing cleanup of stale: ${LEFTOVER}"
    pkill -9 -f "lxc-start.*-n waydroid" 2>/dev/null || true
    umount -l /usr/local/var/lib/waydroid/rootfs 2>/dev/null || true
    umount -l /usr/local/var/lib/waydroid/overlay 2>/dev/null || true
  fi

  # Always remove stale cgroup directories from previous runs.  LXC tries
  # up to 1000 suffixes for lxc.monitor.<name>; if all are taken (ERANGE),
  # lxc-start fails to launch its monitor.
  find /sys/fs/cgroup -name 'lxc*waydroid*' -type d 2>/dev/null | \
    while read -r d; do rmdir "$d" 2>/dev/null || true; done

  # Set up Android binder devices.
  # Two cases: (a) binder built as a loadable module → modprobe creates
  # /dev/binder etc. directly; (b) binder built into the kernel → mount
  # binderfs and symlink the device nodes.
  if [ ! -c /dev/binder ]; then
    if ! modprobe -q binder_linux name=binder,vndbinder,hwbinder 2>/dev/null; then
      mkdir -p /dev/binderfs  # croslint: disable:
      mount -t binder binder /dev/binderfs 2>/dev/null || true
      ln -sf /dev/binderfs/binder /dev/binder  # croslint: disable:
      ln -sf /dev/binderfs/vndbinder /dev/vndbinder  # croslint: disable:
      ln -sf /dev/binderfs/hwbinder /dev/hwbinder  # croslint: disable:
    fi
  fi

  # Copy package-installed Android overlay files into overlay_rw for future
  # use.  NOTE: mount_overlays is set to False below (ChromeOS LSM blocks
  # overlayfs), so these files are not applied via overlayfs.  Audio HAL
  # overrides are instead activated via lxc.py bind-mounts when re-enabled.
  ANDROID_OVERLAY_SRC="/usr/lib/waydroid/android-overlay"
  ANDROID_OVERLAY_DST="/usr/local/var/lib/waydroid/overlay_rw"
  if [ -d "${ANDROID_OVERLAY_SRC}" ] && [ -d "${ANDROID_OVERLAY_DST}" ]; then
    cp -a "${ANDROID_OVERLAY_SRC}/." "${ANDROID_OVERLAY_DST}/"  # croslint: disable:
  fi

  # ChromeOS uses CRAS instead of PulseAudio. Create a dummy pulse socket
  # directory so the LXC config bind-mount does not fail.
  mkdir -p /run/chrome/pulse  # croslint: disable:

  # ----- Phase 2: verify the Wayland compositor is accepting clients ---
  #
  # Existence of /run/chrome/wayland-0 is not enough -- it can be a
  # half-bound socket whose listener isn't accepting yet (especially on
  # the first session right after `started-user-session`), and feeding
  # that to hwcomposer.waydroid.so causes the
  #   "Wayland client was disconnected: Unknown error -1"
  # abort that takes down SurfaceFlinger.  So actually connect once and
  # only proceed when the handshake completes.
  WAYLAND_DEADLINE=$(($(date +%s) + 15))
  while [ "$(date +%s)" -lt "${WAYLAND_DEADLINE}" ]; do
    if [ -S /run/chrome/wayland-0 ] && \
       timeout 1 nc -zU /run/chrome/wayland-0 2>/dev/null; then
      break
    fi
    sleep 0.25
  done
  chmod a+rw /run/chrome/wayland-0 2>/dev/null || true  # croslint: disable:

  # Open CRAS sockets so container audioserver (uid 1041) can connect.
  # The sockets are owned by cras:cras (gid 600); audioserver is not in
  # the cras group, so world-rwx is needed to satisfy DAC.  SELinux
  # (MAC) is handled separately by the cros_cras_client() grant on the
  # whaleos_waydroid domain (see platform2/sepolicy/policy/chromeos/
  # whaleos_waydroid.te).  We deliberately do NOT call `setenforce 0`
  # here -- doing so would leave the host system-wide permissive for
  # the entire session, which fails review and weakens every other
  # ChromeOS daemon's policy as a side effect.
  chmod o+rwx /run/cras 2>/dev/null || true  # croslint: disable:
  chmod o+rw /run/cras/.cras_socket /run/cras/.cras_playback /run/cras/.cras_capture 2>/dev/null || true  # croslint: disable:

  # Pre-claim waydroid0 so shill adds it to blocked_list_ before the bridge
  # interface is created. When waydroid-net.sh brings up waydroid0, shill's
  # AddLinkMsgHandler sees it as blocked and creates only a DeviceStub — no
  # DHCP, no default route, no spurious Ethernet entry in the network UI.
  # (veth* slave interfaces are already ignored by shill's name-prefix filter.)
  dbus-send --system --dest=org.chromium.flimflam / \
    org.chromium.flimflam.Manager.ClaimInterface \
    string:waydroid string:waydroid0 2>/dev/null || true  # croslint: disable:

  # LXC 5.x expects its rootfs staging directory to exist before lxc-start.
  # The compiled-in LXCROOTFSMOUNT path is /usr/local/var/lib/lxc/rootfs.
  mkdir -p /usr/local/var/lib/lxc/rootfs  # croslint: disable:

  # First-boot: generate the LXC config and base props if not yet done.
  # waydroid init auto-detects preinstalled images at
  # /usr/local/share/waydroid-extra/images/ and skips downloading.
  if [ ! -f /usr/local/var/lib/waydroid/waydroid.cfg ]; then
    logger -t "${UPSTART_JOB}" "Running first-boot waydroid init"
    python3 /usr/lib/waydroid/waydroid.py init 2>&1 | logger -t "${UPSTART_JOB}"
    # ChromeOS LSM blocks overlayfs; disable overlay mounts after init.
    sed -i 's/mount_overlays = .*/mount_overlays = False/' \
        /usr/local/var/lib/waydroid/waydroid.cfg 2>/dev/null || true  # croslint: disable:
  fi
end script

# Run from /usr/lib/waydroid so Python can find the 'tools' package.
exec python3 /usr/lib/waydroid/waydroid.py container start

post-start script
  # Create a dummy pulse native socket so the LXC bind-mount entry works.
  # ContainerManager.Start is triggered by waydroid-session (not here) so
  # that the session monitor is registered before Android boots.
  touch /run/chrome/pulse/native 2>/dev/null || true  # croslint: disable:
end script

post-stop script
  # Only run teardown if this instance actually armed the container --
  # signalled by the sentinel pre-start writes after passing the gate.
  # Using the sentinel (instead of re-checking chrome_dev.conf here)
  # keeps teardown honest across a mid-run switch disable: the operator
  # can flip the switch and `restart ui`, and we still unwind the state
  # that the previous start set up.  The sentinel disappears on reboot
  # because /run is tmpfs.
  if [ ! -e /run/waydroid-container.armed ]; then
    exit 0
  fi
  rm -f /run/waydroid-container.armed  # croslint: disable:

  logger -t "${UPSTART_JOB}" "Waydroid container service stopped"

  # Make sure no lxc-start lingers -- upstart's `kill timeout 30` only
  # signals our exec process; under failure modes the LXC monitor /
  # container init can outlive it.
  pkill -9 -f "lxc-start.*-n waydroid" 2>/dev/null || true

  # Unmount and verify each mount actually went away.  `-l` makes the
  # unmount lazy (returns immediately, frees the mount once references
  # drop), so we then poll for the mount to fully disappear before
  # declaring cleanup done.
  for mp in /usr/local/var/lib/waydroid/rootfs \
            /usr/local/var/lib/waydroid/overlay; do
    umount -l "${mp}" 2>/dev/null || true
  done
  UMOUNT_DEADLINE=$(($(date +%s) + 10))
  while [ "$(date +%s)" -lt "${UMOUNT_DEADLINE}" ]; do
    if ! mountpoint -q /usr/local/var/lib/waydroid/rootfs 2>/dev/null && \
       ! mountpoint -q /usr/local/var/lib/waydroid/overlay 2>/dev/null; then
      break
    fi
    sleep 0.25
  done

  # Remove stale lxc.* cgroup directories so the next start doesn't hit
  # ERANGE on the monitor cgroup name allocator.
  find /sys/fs/cgroup -name 'lxc*waydroid*' -type d 2>/dev/null | \
    while read -r d; do rmdir "$d" 2>/dev/null || true; done

  # Release waydroid0 back to shill before tearing down the bridge.
  dbus-send --system --dest=org.chromium.flimflam / \
    org.chromium.flimflam.Manager.ReleaseInterface \
    string:waydroid string:waydroid0 2>/dev/null || true

  # Tear down waydroid network bridge
  /usr/lib/waydroid/data/scripts/waydroid-net.sh stop 2>/dev/null || true
end script
